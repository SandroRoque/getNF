name: getnf

services:
  pocketbase:
    build: .
    restart: unless-stopped
    ports:
      # Loopback: admin UI, tests, and the emulator (as http://10.0.2.2:8090).
      - "127.0.0.1:8090:8090"
      # Home network, for the phone (D18). Set GETNF_LAN_IP in server/.env (not in git) to this PC's
      # LAN address. Never 0.0.0.0: Docker's published ports bypass ufw. Unset = a second loopback address.
      - "${GETNF_LAN_IP:-127.0.0.2}:8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
      - ./pb_hooks:/pb/pb_hooks
      # Category tree + tags, synced into PocketBase at startup (pb_hooks/receipts.pb.js).
      - ../taxonomy:/pb/taxonomy:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
